# Общие настройки для ЛЮБОГО профиля.
# application-<profile>.yml дополняет/перезаписывает то, что здесь.

spring:
  application:
    name: practice-2
  profiles:
    active: dev   # какой профиль включён по умолчанию, если не указано иное

server:
  port: 8080

# Собственные настройки приложения.
# Их прочитает типизированный класс AppProperties (@ConfigurationProperties).
app:
  name: "Task Manager"
  description: "Учебный сервис управления задачами (Practice 2)"
  max-tasks: 50
